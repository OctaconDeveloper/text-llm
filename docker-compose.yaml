services:
  # Your custom simple API (Port 8001)
  simple-api:
    build: .
    ports:
      - "8001:8001"
    volumes:
      - ./models:/app/models
    environment:
      - MODEL_PATH=models/active_model.gguf
    restart: unless-stopped

  # Standard OpenAI-compatible server (Port 8000)
  openai-server:
    image: ghcr.io/abetlen/llama-cpp-python:latest
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
    environment:
      - MODEL=/app/models/active_model.gguf
      - HOST=0.0.0.0
      - PORT=8000
    command: python3 -m llama_cpp.server --model /app/models/active_model.gguf --n_ctx 4096 --n_threads 6 --host 0.0.0.0
    # Note: --n_ctx 4096 is intentionally low to fit in 16GB RAM. 
    # Ignore the "full capacity will not be utilized" warning.
    restart: unless-stopped
